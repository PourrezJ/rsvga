[package]
name = "rsvga-server"
description = "VMware SVGA II device served to QEMU over vfio-user"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rsvga"
path = "src/main.rs"

[dependencies]
minifb = { version = "0.29.0", optional = true }
rustix = { version = "1.1.6", features = ["fs", "mm", "std"] }
svga-core = { path = "../svga-core" }
svga-proto = { path = "../svga-proto" }
vfio-user = { path = "../vfio-user" }

[features]
default = []
window = ["dep:minifb"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
