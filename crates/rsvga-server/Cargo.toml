[package]
name = "rsvga-server"
description = "VMware SVGA II device served to QEMU over vfio-user"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rsvga"
path = "src/main.rs"

[dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "mm", "std"] }
softbuffer = { version = "0.4", optional = true }
svga-core = { path = "../svga-core" }
svga-proto = { path = "../svga-proto" }
svga-render = { path = "../svga-render" }
vfio-user = { path = "../vfio-user" }
winit = { version = "0.30", optional = true }

[features]
default = []
window = ["dep:winit", "dep:softbuffer"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
