[workspace]
resolver = "3"
members = ["crates/svga-proto", "crates/svga-core", "crates/svga-shader", "crates/svga-render", "crates/vfio-user", "crates/rsvga-server"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
